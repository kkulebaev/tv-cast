[project]
name = "tv-cast"
version = "0.1.0"
description = "Cast local movies from the PC to a Chromecast / Google TV over the LAN"
requires-python = ">=3.12"
dependencies = [
    "pychromecast>=14.0",
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[project.scripts]
tvcast = "tv_cast.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tv_cast"]

[dependency-groups]
dev = [
    "ruff>=0.17.6",
]
